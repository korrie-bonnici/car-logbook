<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- speedometer arc -->
  <path d="M120 316 A 136 136 0 1 1 392 316"
        fill="none" stroke="#263445" stroke-width="30" stroke-linecap="round"/>
  <path d="M120 316 A 136 136 0 0 1 214 187"
        fill="none" stroke="url(#dial)" stroke-width="30" stroke-linecap="round"/>

  <!-- needle -->
  <g transform="rotate(-36 256 316)">
    <rect x="248" y="196" width="16" height="128" rx="8" fill="#e6edf3"/>
  </g>
  <circle cx="256" cy="316" r="22" fill="#e6edf3"/>
  <circle cx="256" cy="316" r="9" fill="#0d1117"/>

  <!-- odometer window -->
  <rect x="166" y="356" width="180" height="56" rx="12" fill="#0a0e14" stroke="#30475e" stroke-width="4"/>
  <g fill="#4da3ff" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="38" font-weight="700" text-anchor="middle">
    <text x="256" y="397" letter-spacing="4">12345</text>
  </g>
</svg>
